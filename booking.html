
<!-- Booking Section -->
<section id="booking">

    <h2>Book Your Ticket</h2>

    <div class="booking-container">

        <!-- Booking Form -->
        <form id="bookingForm">

            <h3>Ticket Details</h3>

            <!-- Match Selection -->
            <label for="match">Select Match:</label>

            <select id="match" required>
                <option value="">-- Select Match --</option>
                <option value="RCB vs MI">RCB vs MI</option>
                <option value="CSK vs KKR">CSK vs KKR</option>
                <option value="MI vs PBKS">MI vs PBKS</option>
                <option value="KKR vs RR">KKR vs RR</option>
            </select>

            <!-- Stand Category -->
            <label for="stand">Stand Category:</label>

            <select id="stand" required>
                <option value="">-- Select Stand --</option>
                <option value="General">General</option>
                <option value="Premium">Premium</option>
                <option value="VIP">VIP</option>
            </select>

            <!-- Ticket Quantity -->
            <label for="quantity">Number of Tickets:</label>

            <input
                type="number"
                id="quantity"
                min="1"
                max="10"
                value="1"
                required
            >

            <h3>Personal Details</h3>

            <label for="customerName">Full Name:</label>

            <input
                type="text"
                id="customerName"
                placeholder="Enter your name"
                required
            >

            <label for="customerEmail">Email:</label>

            <input
                type="email"
                id="customerEmail"
                placeholder="Enter your email"
                required
            >

            <label for="customerPhone">Phone Number:</label>

            <input
                type="tel"
                id="customerPhone"
                placeholder="Enter your phone number"
                required
            >

            <button type="submit" class="btn">
                Confirm Booking
            </button>

        </form>


        <!-- Booking Summary Card -->
        <div class="summary">

            <h3>Booking Summary</h3>

            <p>Match: <span id="summaryMatch">Not Selected</span></p>

            <p>Stand: <span id="summaryStand">Not Selected</span></p>

            <p>Ticket Price: <span id="summaryPrice">₹0</span></p>

            <p>Quantity: <span id="summaryQuantity">1</span></p>

            <h3>
                Total Amount:
                <span id="summaryTotal">₹0</span>
            </h3>

        </div>

    </div>

</section>
